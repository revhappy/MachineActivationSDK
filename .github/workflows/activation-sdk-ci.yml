name: Activation SDK CI

on:
  push:
    paths:
      - '**'
      - '.github/workflows/activation-sdk-ci.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/activation-sdk-ci.yml'
  workflow_dispatch:

jobs:
  sdk-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Verify SDK package
        run: npm run release:verify

  # The Python client is the non-JS lane's entire on-ramp, so it is checked on
  # every push rather than only at release. It has no dependencies, so this is
  # cheap, and it runs on the oldest and newest supported interpreters because
  # the supervisor touches process APIs that have moved between versions.
  python-client-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.13']
    defaults:
      run:
        working-directory: clients/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run supervisor tests
        run: python -m unittest discover -s tests -t .

      - name: Build and check metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

  basic-consumer-check:
    runs-on: ubuntu-latest
    needs: sdk-check
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/basic-consumer/package-lock.json

      - name: Install SDK dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Install example consumer dependencies
        working-directory: examples/basic-consumer
        run: npm ci

      - name: Verify example consumer
        working-directory: examples/basic-consumer
        run: npm run check
